<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1e21">
<title>آهن‌آلات کاسپین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #1b1e21;
  --panel-top: #2c3135;
  --panel-bottom: #23272b;
  --edge: #3a4046;
  --hi: rgba(255,255,255,.09);
  --ink: #f2f4f5;
  --muted: #a0a9b0;
  --silver-1: #ffffff;
  --silver-2: #aeb7be;
  --amber: #e9ab3e;
  --amber-soft: rgba(233,171,62,.14);
  --amber-ring: rgba(233,171,62,.38);
  --font-title: "Lalezar", "Vazirmatn", Tahoma, sans-serif;
  --font-body: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}
.page {
  position: relative;
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  margin-inline: auto;
  padding: max(70px, calc(env(safe-area-inset-top) + 40px)) max(18px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 38px;
  background:
    radial-gradient(ellipse 85% 300px at 50% -40px, rgba(255,255,255,.17), rgba(255,255,255,0) 72%),
    radial-gradient(ellipse 60% 220px at 50% 0, rgba(233,171,62,.10), rgba(233,171,62,0) 70%),
    var(--bg);
  overflow: hidden;
}
/* brushed steel grain */
.page::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);
  -webkit-mask-image: linear-gradient(to bottom, #000, transparent 70%);
  mask-image: linear-gradient(to bottom, #000, transparent 70%);
}
.page > * { position: relative; }

/* heading */
header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
h1 {
  margin: 0;
  font-family: var(--font-title); font-weight: 400;
  font-size: clamp(40px, 12.6vw, 56px); line-height: 1.3;
  background: linear-gradient(180deg, var(--silver-1) 20%, var(--silver-2) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 2px 10px rgba(0,0,0,.35));
  text-wrap: balance;
}
/* top light edge */
.page::after {
  content: ""; position: absolute; top: 0; left: 18%; right: 18%; height: 2px; pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  box-shadow: 0 0 22px 2px var(--amber-ring);
}
/* divider with a hex nut */
.orn { display: flex; align-items: center; gap: 14px; width: min(260px, 70%); }
.orn::before, .orn::after { content: ""; flex: 1; height: 1.5px; background: linear-gradient(90deg, transparent, var(--amber-ring)); }
.orn::after { background: linear-gradient(270deg, transparent, var(--amber-ring)); }
.orn svg { width: 22px; height: 22px; flex: none; fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.6; stroke-linejoin: round; filter: drop-shadow(0 0 8px var(--amber-ring)); }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
header, .card { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
.card:nth-child(1) { animation-delay: .08s; }
.card:nth-child(2) { animation-delay: .16s; }
.card:nth-child(3) { animation-delay: .24s; }
.card:nth-child(4) { animation-delay: .32s; }
.sub { margin: 0; max-width: 28ch; font-size: 14.5px; line-height: 1.8; color: var(--muted); text-wrap: balance; }

/* cards */
.cards { display: flex; flex-direction: column; gap: 14px; }
.card {
  position: relative;
  display: flex; align-items: center; gap: 14px;
  padding: 18px 18px 18px 16px;
  border-radius: 24px;
  border: 1px solid var(--edge);
  background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
  box-shadow: inset 0 1px 0 var(--hi), 0 10px 24px rgba(0,0,0,.35);
  color: inherit; text-decoration: none;
  transition: transform .12s, border-color .15s;
}
.card::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.05) 50%, transparent 62%);
}
.card:active { transform: scale(.985); border-color: var(--amber-ring); }
.card:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.body { flex: 1; min-width: 0; }
.label { display: block; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.value {
  display: block; font-weight: 700; font-size: 25px; line-height: 1.45; letter-spacing: .04em;
  direction: ltr; unicode-bidi: isolate; text-align: right; font-variant-numeric: tabular-nums;
}
.value.handle { font-size: 20px; font-weight: 600; letter-spacing: .01em; }
.value.addr { direction: rtl; font-size: 15.5px; font-weight: 500; line-height: 1.9; letter-spacing: 0; }
.ico {
  flex: none; width: 50px; height: 50px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--amber);
  background: var(--amber-soft);
  border: 1px solid var(--amber-ring);
  box-shadow: 0 0 0 5px rgba(233,171,62,.06), 0 0 22px rgba(233,171,62,.16);
}
.ico svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

@media (max-height: 800px) { .page { gap: 24px; padding-top: 36px; } .card { padding-block: 11px; } .ico { width: 44px; height: 44px; } .cards { gap: 10px; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } header, .card { animation: none; } }
</style>
</head>
